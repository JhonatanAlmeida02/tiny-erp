name: Atualizar Localização de Produto (Tiny)

# Dois gatilhos:
# 1) workflow_dispatch: formulário manual na aba Actions (fallback)
# 2) repository_dispatch: disparado pelo Power Automate (evento "atualizar-localizacao")
on:
  workflow_dispatch:
    inputs:
      produto_id:
        description: "ID do produto no Tiny"
        required: true
        type: string
      localizacao:
        description: "Nova localização (ex: Corredor 3, Prateleira B)"
        required: true
        type: string
  repository_dispatch:
    types: [atualizar-localizacao]

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install aiohttp pandas

      - name: Atualizar localização do produto
        env:
          TINY_TOKEN: ${{ secrets.TINY_TOKEN }}
          # Pega do payload (Power Automate) ou do formulário manual
          PRODUTO_ID: ${{ github.event.client_payload.id || inputs.produto_id }}
          LOCALIZACAO: ${{ github.event.client_payload.localizacao || inputs.localizacao }}
        run: |
          python atualizarLocalizacao.py \
            --id "$PRODUTO_ID" \
            --localizacao "$LOCALIZACAO"
