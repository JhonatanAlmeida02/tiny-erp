name: Sync Estoque Tiny

on:
  workflow_dispatch: {}   # agendamento externo via cron-job.org

permissions:
  contents: write

# Impede que este workflow rode ao mesmo tempo que os outros que escrevem
# em TB_bases/ (produtos, tags, etc.). Para funcionar, o MESMO group precisa
# ser adicionado nos outros workflows.
concurrency:
  group: tb-bases-push
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # evita runner pendurado se a API do Tiny travar

    env:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # histórico completo: necessário para o rebase no fim

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar sincronização de estoque
        env:
          TINY_TOKEN: ${{ secrets.TINY_TOKEN }}
        run: python getObterEstoque.py

      - name: Enviar CSV para o SharePoint (DP Logística)
        if: hashFiles('TB_bases/Tb_BaseEstoque_Tiny.csv') != ''
        run: python enviar_sharepoint.py TB_bases/Tb_BaseEstoque_Tiny.csv tinyEstoque dpLogistica

      - name: Enviar CSV para o SharePoint (Prodigy Hub)
        # !cancelled() garante que este envio aconteça mesmo se o anterior falhar
        if: ${{ !cancelled() && hashFiles('TB_bases/Tb_BaseEstoque_Tiny.csv') != '' }}
        run: python enviar_sharepoint.py TB_bases/Tb_BaseEstoque_Tiny.csv TinyERP prodigyHub

      - name: Salvar checkpoint e CSV atualizados no repositório
        # Roda mesmo se o envio ao SharePoint falhar: o checkpoint precisa ser
        # salvo de qualquer jeito, senão as chamadas já feitas à API do Tiny
        # são perdidas e o próximo run refaz tudo do zero.
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add TB_bases/
          if git diff --staged --quiet; then
            echo "Nada novo para commitar."
            exit 0
          fi
          git commit -m "Atualiza estoque [skip ci]"
          # Se outro workflow (produtos, tags, etc.) deu push entre o checkout
          # e agora, o push abaixo seria rejeitado. Por isso: puxa com rebase
          # e tenta de novo, algumas vezes, antes de desistir.
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            # Se o rebase parou no meio (conflito), precisa abortar — senão as
            # tentativas seguintes falham direto com "rebase in progress".
            git rebase --abort 2>/dev/null || true
            echo "Push falhou (tentativa $i/5), tentando de novo em instantes..."
            sleep $((RANDOM % 15 + 5))
          done
          echo "Falha ao dar push depois de várias tentativas."
          exit 1
