name: Sync Estoque Tiny

on:
  schedule:
    # De hora em hora, das 8h às 17h horário de Brasília (UTC-3) = 11h às 20h UTC
    - cron: '0 11-20 * * *'
  workflow_dispatch: {}   # permite rodar manualmente pela aba Actions

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar sincronização de estoque
        env:
          TINY_TOKEN: ${{ secrets.TINY_TOKEN }}
        run: python getObterEstoque.py

      - name: Enviar CSV para o SharePoint (DP Logística)
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          if [ -f TB_bases/Tb_BaseEstoque_Tiny.csv ]; then
            python enviar_sharepoint.py TB_bases/Tb_BaseEstoque_Tiny.csv tinyEstoque
          else
            echo "CSV ainda não existe (nenhum dado coletado ainda) — pulando envio."
          fi

      - name: Salvar checkpoint e CSV atualizados no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add TB_bases/
          if git diff --staged --quiet; then
            echo "Nada novo para commitar."
            exit 0
          fi
          git commit -m "Atualiza estoque [skip ci]"
          # Se outro workflow (produtos, tags, etc.) deu push entre o checkout
          # e agora, o push abaixo seria rejeitado. Por isso: puxa com rebase
          # e tenta de novo, algumas vezes, antes de desistir.
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            echo "Push falhou (tentativa $i/5), tentando de novo em instantes..."
            sleep $((RANDOM % 15 + 5))
          done
          echo "Falha ao dar push depois de várias tentativas."
          exit 1
