name: Sync Produtos Tiny

on:
  schedule:
    # 22h horário de Brasília (UTC-3) = 1h UTC do dia seguinte
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      carga_completa:
        description: 'Refazer a base inteira (preenche todos os campos em todos os produtos; ~45 min)'
        type: boolean
        default: false

# Nunca roda duas sincronizações de produtos ao mesmo tempo (a segunda espera a primeira)
concurrency:
  group: sync-produtos
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar sincronização de produtos
        env:
          TINY_TOKEN: ${{ secrets.TINY_TOKEN }}
          FORCAR_CARGA_COMPLETA: ${{ inputs.carga_completa && '1' || '' }}
          # na carga completa usa 60/min para sobrar cota para o Sync Estoque e o agente (plano: 120/min)
          TINY_LIMITE_MINUTO: ${{ inputs.carga_completa && '60' || '100' }}
        run: python getObterProdutos.py

      - name: Enviar CSV para o SharePoint (Prodigy Hub)
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          if [ -f TB_bases/Tb_BaseProdutos_Tiny.csv ]; then
            python enviar_sharepoint.py TB_bases/Tb_BaseProdutos_Tiny.csv TinyERP prodigyHub
          else
            echo "CSV ainda não existe — pulando envio."
          fi

      - name: Salvar checkpoint e CSV atualizados no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add TB_bases/
          if git diff --staged --quiet; then
            echo "Nada novo para commitar."
            exit 0
          fi
          git commit -m "Atualiza produtos [skip ci]"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            echo "Push falhou (tentativa $i/5), tentando de novo em instantes..."
            sleep $((RANDOM % 15 + 5))
          done
          echo "Falha ao dar push depois de várias tentativas."
          exit 1
