name: Sync Produtos Tiny

on:
  schedule:
    # 22h horário de Brasília (UTC-3) = 1h UTC do dia seguinte
    - cron: '0 1 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar sincronização de produtos
        env:
          TINY_TOKEN: ${{ secrets.TINY_TOKEN }}
        run: python getObterProdutos.py

      - name: Salvar checkpoint e CSV atualizados no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add TB_bases/
          git diff --staged --quiet || git commit -m "Atualiza produtos [skip ci]"
          git push
