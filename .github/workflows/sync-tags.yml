name: Sync Tags Produtos Tiny

on:
  schedule:
    # 00h horário de Brasília (UTC-3) = 3h UTC, a cada 2 dias (dias 1,3,5,7... do mês).
    # Reduz pela metade o consumo de minutos do GitHub Actions, já que esse
    # script busca tags de TODOS os produtos (não é incremental).
    - cron: '0 3 */2 * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # garante que pega o CSV de produtos já atualizado

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar sincronização de tags
        env:
          TINY_TOKEN: ${{ secrets.TINY_TOKEN }}
        run: python getObterTags.py

      - name: Salvar CSV atualizado no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add TB_bases/
          git diff --staged --quiet || git commit -m "Atualiza tags de produtos [skip ci]"
          git push
