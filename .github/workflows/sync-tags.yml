name: Sync Tags Produtos Tiny

on:
  schedule:
    # 00h horário de Brasília (UTC-3) = 3h UTC, a cada 2 dias (dias 1,3,5,7... do mês).
    # Reduz pela metade o consumo de minutos do GitHub Actions, já que esse
    # script busca tags de TODOS os produtos (não é incremental).
    - cron: '0 3 */2 * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # garante que pega o CSV de produtos já atualizado

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar sincronização de tags
        env:
          TINY_TOKEN: ${{ secrets.TINY_TOKEN }}
        run: python getObterTags.py

      - name: Enviar CSV para o SharePoint (Prodigy Hub)
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          if [ -f TB_bases/Tb_ProdutosTag_Tiny.csv ]; then
            python enviar_sharepoint.py TB_bases/Tb_ProdutosTag_Tiny.csv TinyERP prodigyHub
          else
            echo "CSV ainda não existe — pulando envio."
          fi

      - name: Salvar CSV atualizado no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add TB_bases/
          if git diff --staged --quiet; then
            echo "Nada novo para commitar."
            exit 0
          fi
          git commit -m "Atualiza tags de produtos [skip ci]"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            echo "Push falhou (tentativa $i/5), tentando de novo em instantes..."
            sleep $((RANDOM % 15 + 5))
          done
          echo "Falha ao dar push depois de várias tentativas."
          exit 1
