name: Atualizar Localização de Produto (Tiny)

# Cria um formulário nativo na aba "Actions" do GitHub (e no app mobile):
# Actions → "Atualizar Localização de Produto (Tiny)" → botão "Run workflow"
on:
  workflow_dispatch:
    inputs:
      produto_id:
        description: "ID do produto no Tiny"
        required: true
        type: string
      localizacao:
        description: "Nova localização (ex: Corredor 3, Prateleira B)"
        required: true
        type: string

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install aiohttp pandas

      - name: Atualizar localização do produto
        env:
          TINY_TOKEN: ${{ secrets.TINY_TOKEN }}
        run: |
          python atualizarLocalizacao.py \
            --id "${{ inputs.produto_id }}" \
            --localizacao "${{ inputs.localizacao }}"
